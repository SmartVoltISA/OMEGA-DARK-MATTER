name: Ω-DM Synthetic Reproducibility

on:
  push:
    branches: [main]
    paths:
      - "experiments/Ω-DM-001/**"
      - "experiments/relational_fabric_connectivity_memory_controls.py"
      - "experiments/verify_omega17_reproducibility.py"
      - "results/2026-10-09-relational-fabric-connectivity-memory-controls.json"
      - ".github/workflows/synthetic-reproducibility.yml"
  pull_request:
    paths:
      - "experiments/Ω-DM-001/**"
      - "experiments/relational_fabric_connectivity_memory_controls.py"
      - "experiments/verify_omega17_reproducibility.py"
      - "results/2026-10-09-relational-fabric-connectivity-memory-controls.json"
      - ".github/workflows/synthetic-reproducibility.yml"

permissions:
  contents: write

jobs:
  reproduce-synthetic-results:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ω-17 dependency
        run: python -m pip install numpy
      - name: Reproduce Ω-DM-001 from committed source
        run: python experiments/Ω-DM-001/run_synthetic.py | tee results/2026-10-10-dm001-reproduction.txt
      - name: Reproduce Ω-17 and compare aggregate result
        run: python experiments/verify_omega17_reproducibility.py
      - name: Preserve direct execution outputs
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "Ω-DM Reproducibility Bot"
          git config user.email "omega-reproducibility[bot]@users.noreply.github.com"
          git add results/2026-10-10-dm001-reproduction.txt results/2026-10-10-relational-fabric-connectivity-memory-controls-reproduction.json
          git diff --cached --quiet || git commit -m "results: preserve direct synthetic reproducibility run"
          git push
